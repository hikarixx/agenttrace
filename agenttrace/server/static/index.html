<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentTrace Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --info: #0ea5e9;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            color: #94a3b8;
            font-weight: 500;
        }
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-started { background-color: rgba(59, 130, 246, 0.2); color: var(--primary); }
        .status-completed { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-failed { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .tree-node {
            margin-left: 1.5rem;
            border-left: 1px solid var(--border-color);
            padding-left: 1rem;
            margin-top: 0.5rem;
        }
        .node-title {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            background: #2dd4bf1a;
            display: inline-block;
            margin-bottom: 0.25rem;
        }
        .node-title:hover {
            background: #2dd4bf33;
        }
        .node-details {
            background: #000;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            display: none;
        }
        a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        
        #view-run { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AgentTrace</h1>
            <a onclick="showList()">← Back to Runs</a>
        </header>

        <div id="view-list">
            <div class="card">
                <h2>Recent Runs</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Agent</th>
                            <th>Task</th>
                            <th>Status</th>
                            <th>Started</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="runs-tbody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="view-run">
            <div class="card" id="run-summary">
                <!-- populated by js -->
            </div>

            <div class="card" style="margin-top: 1rem; padding-bottom: 2rem;">
                <h2>Metrics (Token & Cost)</h2>
                <div style="height: 250px; width: 100%;">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>

            <h2>Execution Tree</h2>
            <div class="card" id="run-tree">
                <!-- populated by js -->
            </div>
        </div>
    </div>

    <!-- Tích hợp Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const formatStatus = (s) => `<span class="status-badge status-${s.toLowerCase()}">${s}</span>`;
        
        async function fetchRuns() {
            const res = await fetch('/api/runs?_t=' + new Date().getTime());
            const data = await res.json();
            const tbody = document.getElementById('runs-tbody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No runs recorded yet.</td></tr>';
                return;
            }

            data.forEach(run => {
                const tr = document.createElement('tr');
                const start = new Date(run.started_at).toLocaleString();
                const dur = run.duration !== null ? run.duration.toFixed(2) + 's' : '-';
                
                tr.innerHTML = `
                    <td><a onclick="showRun('${run.id}')" title="${run.id}">${run.id.length > 20 ? run.id.substring(0,8) + '...' + run.id.substring(run.id.length-8) : run.id}</a></td>
                    <td>${run.agent}</td>
                    <td>${run.task}</td>
                    <td>${formatStatus(run.status)}</td>
                    <td>${start}</td>
                    <td>${dur}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function showRun(id) {
            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-run').style.display = 'block';
            
            const res = await fetch(`/api/runs/${id}/export`);
            const data = await res.json();
            
            const run = data.run;
            document.getElementById('run-summary').innerHTML = `
                <p><strong>ID:</strong> ${run.id}</p>
                <p><strong>Agent:</strong> ${run.agent}</p>
                <p><strong>Task:</strong> ${run.task}</p>
                <p><strong>Status:</strong> ${formatStatus(run.status)}</p>
            `;

            const treeContainer = document.getElementById('run-tree');
            treeContainer.innerHTML = '';
            
            function renderNode(node, container) {
                const el = document.createElement('div');
                el.className = 'tree-node';
                
                const toolName = node.metadata?.tool_name ? `[${node.metadata.tool_name}] ` : '';
                const dur = node.duration !== null ? ` (${node.duration.toFixed(2)}s)` : '';
                
                const title = document.createElement('div');
                title.className = 'node-title';
                title.innerHTML = `▸ ${toolName}${node.type} ${formatStatus(node.status)}${dur}`;
                
                const details = document.createElement('pre');
                details.className = 'node-details';
                details.textContent = JSON.stringify(node.metadata, null, 2);
                
                title.onclick = () => {
                    details.style.display = details.style.display === 'block' ? 'none' : 'block';
                };
                
                el.appendChild(title);
                el.appendChild(details);
                
                if (node.children && node.children.length > 0) {
                    node.children.forEach(c => renderNode(c, el));
                }
                
                container.appendChild(el);
            }
            
            data.tree.forEach(rootNode => renderNode(rootNode, treeContainer));

            // Vẽ biểu đồ Chart.js
            const ctx = document.getElementById('metricsChart').getContext('2d');
            if (window.metricsChartInstance) {
                window.metricsChartInstance.destroy();
            }

            let labels = [];
            let promptData = [];
            let completionData = [];
            
            data.events.forEach((evt, idx) => {
                if (evt.metadata && evt.metadata.metrics) {
                    labels.push(evt.metadata.tool_name || `Tool ${idx}`);
                    promptData.push(evt.metadata.metrics.prompt_tokens || 0);
                    completionData.push(evt.metadata.metrics.completion_tokens || 0);
                }
            });

            if (labels.length === 0) {
                // Dummy data nếu không có metrics
                labels = ["Search", "Summarize", "WriteCode"];
                promptData = [120, 400, 800];
                completionData = [50, 200, 1500];
            }

            window.metricsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Prompt Tokens',
                            data: promptData,
                            backgroundColor: 'rgba(59, 130, 246, 0.7)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Completion Tokens',
                            data: completionData,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, stacked: true },
                        x: { stacked: true }
                    }
                }
            });
        }

        function showList() {
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-run').style.display = 'none';
            fetchRuns();
        }

        showList();
    </script>
</body>
</html>
